# docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
services:
  crm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_FILE: /data/crm.db
    volumes:
      - crm-data:/data
    ports:
      - "127.0.0.1:3000:3000"   # only the reverse proxy on this host reaches it
volumes:
  crm-data:
