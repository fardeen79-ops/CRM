# Reverse proxy with HTTPS in front of the app. Adjust the server name and certificate paths.
server {
    listen 80;
    server_name crm-test.yourbank.ae;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name crm-test.yourbank.ae;

    ssl_certificate     /etc/ssl/certs/crm-test.yourbank.ae.crt;
    ssl_certificate_key /etc/ssl/private/crm-test.yourbank.ae.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Bulk uploads are up to 6 MB
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
